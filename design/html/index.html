<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dynamo Rental - HTML Prototype</title>
  <style>
    /* Hallmark · pre-emit critique: P5 H5 E4 S5 R4 V5
     * Hallmark · genre: modern-minimal operations · macrostructure: Depot Control Board · designed-as-app
     */
    :root {
      --color-paper: oklch(97% 0.011 82);
      --color-paper-2: oklch(93% 0.014 82);
      --color-surface: oklch(99% 0.006 82);
      --color-ink: oklch(22% 0.028 248);
      --color-ink-2: oklch(47% 0.03 248);
      --color-rule: oklch(82% 0.022 82);
      --color-yard: oklch(89% 0.032 170);
      --color-yard-2: oklch(84% 0.038 170);
      --color-yard-ink: oklch(22% 0.035 178);
      --color-accent: oklch(79% 0.13 76);
      --color-accent-ink: oklch(22% 0.035 76);
      --color-run: oklch(50% 0.095 178);
      --color-run-soft: oklch(92% 0.055 178);
      --color-risk: oklch(58% 0.145 30);
      --color-risk-soft: oklch(94% 0.04 30);
      --color-focus: oklch(58% 0.12 248);
      --font-display: "Segoe UI Variable Display", "Segoe UI", Tahoma, Arial, sans-serif;
      --font-body: "Segoe UI Variable Text", "Segoe UI", Tahoma, Arial, sans-serif;
      --font-code: Consolas, "Courier New", monospace;
      --space-2xs: 0.5rem;
      --space-xs: 0.75rem;
      --space-sm: 1rem;
      --space-md: 1.5rem;
      --space-lg: 2rem;
      --space-xl: 3rem;
      --radius-card: 6px;
      --radius-pill: 999px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --dur-short: 160ms;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; overflow-x: clip; }
    body {
      margin: 0;
      background: var(--color-paper-2);
      color: var(--color-ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      height: 40px;
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-card);
      background: var(--color-surface);
      color: var(--color-ink);
      padding: 0 var(--space-sm);
      font-size: 14px;
      font-weight: 650;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition: filter var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out);
    }

    button.primary {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: var(--color-accent-ink);
      font-weight: 700;
    }

    button:hover { filter: brightness(0.98); }
    button:active { transform: translateY(1px); }
    button:focus-visible,
    .tab:focus-visible,
    .navButton:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .appShell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      background: var(--color-paper);
    }

    .yard {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      background: var(--color-yard);
      color: var(--color-yard-ink);
      border-right: 1px solid var(--color-yard-2);
      padding: var(--space-md);
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      gap: var(--space-md);
    }

    .mark {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
    }

    .mark span {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-card);
      background: var(--color-accent);
      color: var(--color-accent-ink);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-family: var(--font-display);
    }

    .mark strong {
      display: block;
      font-size: 18px;
      line-height: 1.05;
      font-weight: 760;
    }

    .mark small {
      display: block;
      margin-top: 4px;
      color: var(--color-ink-2);
      font-size: 12px;
    }

    .yardDate {
      border-top: 1px solid var(--color-yard-2);
      border-bottom: 1px solid var(--color-yard-2);
      padding: var(--space-sm) 0;
    }

    .label,
    .yardDate small,
    .railLabel,
    .sectionLabel,
    .card small,
    th {
      color: var(--color-ink-2);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.045em;
      text-transform: uppercase;
    }

    .yardDate strong {
      display: block;
      font-family: var(--font-code);
      font-size: 34px;
      line-height: 1;
      margin-top: 6px;
    }

    .navStack {
      display: grid;
      gap: 6px;
    }

    .navButton {
      width: 100%;
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: var(--radius-card);
      background: transparent;
      color: var(--color-yard-ink);
      padding: 0 var(--space-xs);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      font-size: 13px;
      font-weight: 650;
    }

    .navButton .navCode {
      font-family: var(--font-code);
      font-size: 11px;
      color: var(--color-ink-2);
    }

    .navButton.active {
      background: var(--color-surface);
      border-color: var(--color-yard-2);
    }

    .powerStack {
      display: grid;
      gap: var(--space-xs);
      align-content: start;
    }

    .powerSlot {
      border: 1px solid var(--color-yard-2);
      border-radius: var(--radius-card);
      padding: var(--space-sm);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--space-xs);
      align-items: center;
    }

    .powerSlot b {
      display: block;
      font-family: var(--font-code);
      font-size: 23px;
    }

    .powerSlot span {
      color: var(--color-ink-2);
      font-size: 12px;
    }

    .yardNote {
      border: 1px solid var(--color-yard-2);
      border-radius: var(--radius-card);
      padding: var(--space-sm);
      color: var(--color-ink-2);
      font-size: 13px;
      line-height: 1.45;
    }

    .yardNote b {
      display: block;
      color: var(--color-ink);
      margin-bottom: var(--space-2xs);
    }

    .main {
      min-width: 0;
      padding: var(--space-lg);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: var(--space-md);
    }

    .command {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      align-items: center;
      gap: var(--space-xs);
    }

    .search {
      height: 44px;
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-card);
      background: var(--color-surface);
      display: flex;
      align-items: center;
      padding: 0 var(--space-sm);
      color: var(--color-ink-2);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-pill);
      background: var(--color-paper-2);
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .screen {
      min-width: 0;
      display: none;
      animation: fadeIn var(--dur-short) var(--ease-out);
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pageHead {
      display: flex;
      justify-content: space-between;
      gap: var(--space-md);
      align-items: start;
      margin-bottom: var(--space-md);
    }

    .pageHead h1 {
      margin: 0;
      max-width: 780px;
      font-family: var(--font-display);
      font-size: 48px;
      line-height: 1.06;
      letter-spacing: 0;
      font-weight: 720;
      overflow-wrap: anywhere;
    }

    .pageHead p {
      margin: var(--space-xs) 0 0;
      max-width: 68ch;
      color: var(--color-ink-2);
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: var(--space-xs);
      align-items: center;
      flex-wrap: wrap;
      justify-content: end;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr);
      gap: var(--space-md);
      align-items: start;
      margin-bottom: var(--space-md);
    }

    .heroStrip,
    .card,
    .panel {
      background: var(--color-surface);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-card);
    }

    .heroStrip {
      padding: var(--space-sm);
      display: grid;
      gap: var(--space-2xs);
    }

    .stripRow {
      display: grid;
      grid-template-columns: 68px 1fr auto;
      gap: var(--space-sm);
      align-items: center;
      border-bottom: 1px solid var(--color-rule);
      padding-bottom: var(--space-2xs);
    }

    .stripRow:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    time,
    code,
    .money b {
      font-family: var(--font-code);
      font-weight: 850;
    }

    .stripRow b,
    .riskItem b,
    .panelHead strong {
      display: block;
      font-weight: 720;
    }

    .stripRow span,
    .riskItem span {
      color: var(--color-ink-2);
      font-size: 13px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-sm);
      margin-bottom: var(--space-md);
    }

    .card {
      min-height: 96px;
      padding: var(--space-sm);
    }

    .card strong {
      display: block;
      font-family: var(--font-code);
      font-size: 30px;
      margin: var(--space-2xs) 0;
    }

    .card span {
      color: var(--color-ink-2);
      font-size: 13px;
    }

    .grid,
    .dispatchGrid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.85fr);
      gap: var(--space-md);
    }

    .dispatchGrid {
      grid-template-columns: minmax(0, 1.55fr) minmax(0, 0.75fr);
    }

    .stack {
      display: grid;
      gap: var(--space-md);
      align-content: start;
    }

    .panel {
      padding: var(--space-sm);
      min-width: 0;
    }

    .panelHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-sm);
      border-bottom: 1px solid var(--color-rule);
      padding-bottom: var(--space-xs);
      margin-bottom: var(--space-sm);
    }

    .panelHead strong {
      font-family: var(--font-display);
      font-size: 16px;
    }

    .filters {
      display: flex;
      gap: var(--space-xs);
      flex-wrap: wrap;
      margin-bottom: var(--space-md);
    }

    .filters button {
      height: 36px;
      background: var(--color-surface);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      padding: 11px 10px;
      border-bottom: 1px solid var(--color-rule);
      background: var(--color-paper);
      white-space: nowrap;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid var(--color-rule);
      white-space: nowrap;
      vertical-align: middle;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 24px;
      border-radius: var(--radius-pill);
      padding: 0 var(--space-xs);
      background: var(--color-paper-2);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.run {
      background: var(--color-run-soft);
      color: var(--color-run);
    }

    .badge.risk {
      background: var(--color-risk-soft);
      color: var(--color-risk);
    }

    .bars {
      height: 200px;
      display: flex;
      align-items: end;
      gap: var(--space-sm);
      padding: var(--space-sm);
      background: var(--color-paper);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-card);
    }

    .bars div {
      flex: 1;
      text-align: center;
      color: var(--color-ink-2);
      font-size: 12px;
    }

    .bars i {
      display: block;
      max-width: 54px;
      margin: 0 auto var(--space-xs);
      background: var(--color-run);
      border-radius: 4px 4px 0 0;
    }

    .map {
      height: 220px;
      border: 1px solid var(--color-rule);
      background:
        linear-gradient(90deg, var(--color-rule) 1px, transparent 1px),
        linear-gradient(var(--color-rule) 1px, transparent 1px),
        var(--color-paper);
      background-size: 34px 34px;
      border-radius: var(--radius-card);
      position: relative;
    }

    .pin {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: var(--radius-pill);
      background: var(--color-risk);
      box-shadow: 0 0 0 8px var(--color-risk-soft);
    }

    .pin.a { left: 88px; top: 76px; }
    .pin.b { right: 90px; top: 52px; background: var(--color-focus); box-shadow: 0 0 0 8px oklch(91% 0.035 248); }
    .pin.c { left: 220px; bottom: 66px; background: var(--color-run); box-shadow: 0 0 0 8px var(--color-run-soft); }
    .pin.d { right: 138px; bottom: 54px; background: var(--color-accent); box-shadow: 0 0 0 8px oklch(93% 0.045 76); }

    .riskList,
    .timeline,
    .checks,
    .formGrid,
    .money,
    .settingsGrid {
      display: grid;
      gap: var(--space-xs);
    }

    .riskItem,
    .timelineItem,
    .moneyLine {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--space-xs);
      align-items: center;
      border-bottom: 1px solid var(--color-rule);
      padding-bottom: var(--space-xs);
    }

    .timelineItem {
      grid-template-columns: 60px 1fr auto;
    }

    .riskItem:last-child,
    .timelineItem:last-child,
    .moneyLine:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .riskItem strong {
      font-family: var(--font-code);
      font-size: 22px;
    }

    .specGrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-xs);
    }

    .spec {
      background: var(--color-paper);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-card);
      padding: var(--space-sm);
    }

    .spec small {
      display: block;
      color: var(--color-ink-2);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .spec strong {
      display: block;
      font-size: 18px;
    }

    .formGrid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    label.field {
      display: grid;
      gap: 6px;
      color: var(--color-ink-2);
      font-size: 12px;
    }

    .inputLike {
      min-height: 40px;
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-card);
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      align-items: center;
      padding: 0 var(--space-sm);
      font-size: 14px;
    }

    .moneyLine.total {
      font-size: 20px;
      font-weight: 800;
    }

    .checks div {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 8px;
      align-items: center;
    }

    .checks i {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid var(--color-rule);
      background: var(--color-surface);
      display: grid;
      place-items: center;
      font-style: normal;
      color: var(--color-run);
      font-weight: 900;
    }

    .dispatchList {
      display: grid;
      gap: var(--space-xs);
    }

    .dispatchRow {
      display: grid;
      grid-template-columns: 70px 0.8fr 1fr 1.3fr 1fr 0.8fr 96px;
      gap: var(--space-xs);
      align-items: center;
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-card);
      background: var(--color-paper);
      padding: var(--space-sm);
      min-height: 78px;
    }

    .settingsGrid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .settingBox {
      background: var(--color-paper);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-card);
      padding: var(--space-sm);
    }

    .settingBox b {
      display: block;
      margin-bottom: 6px;
    }

    .settingBox span {
      color: var(--color-ink-2);
      font-size: 12px;
    }

    .authScreen {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
      background: var(--color-paper);
    }

    .authIntro {
      padding: var(--space-xl);
      background: var(--color-yard);
      display: grid;
      align-content: center;
      gap: var(--space-lg);
    }

    .authIntro h1 {
      max-width: 720px;
      margin: 0;
      font-family: var(--font-display);
      font-size: 56px;
      line-height: 1.06;
      font-weight: 720;
    }

    .authIntro p {
      max-width: 66ch;
      margin: 0;
      color: var(--color-ink-2);
      line-height: 1.5;
      font-size: 18px;
    }

    .authStats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-sm);
      max-width: 700px;
    }

    .loginBox {
      align-self: center;
      justify-self: center;
      width: min(430px, calc(100% - 48px));
      background: var(--color-surface);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-card);
      padding: var(--space-lg);
      display: grid;
      gap: var(--space-sm);
    }

    .loginBox h2 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 720;
      font-size: 30px;
    }

    .loginBox button {
      width: 100%;
    }

    .mobilePreview {
      width: 390px;
      min-height: 720px;
      margin: 0 auto;
      border: 1px solid var(--color-rule);
      background: var(--color-paper);
      border-radius: 16px;
      overflow: hidden;
    }

    .mobileTop {
      background: var(--color-yard);
      padding: var(--space-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--color-yard-2);
    }

    .mobileBody {
      padding: var(--space-sm);
      display: grid;
      gap: var(--space-sm);
    }

    @media (max-width: 1100px) {
      .appShell { grid-template-columns: 1fr; }
      .yard {
        position: relative;
        height: auto;
        grid-template-rows: auto;
      }
      .powerStack { display: none; }
      .yardNote { display: none; }
      .navStack { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .command { grid-template-columns: 1fr auto; }
      .command button, .avatar { display: none; }
      .hero, .grid, .dispatchGrid { grid-template-columns: 1fr; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .pageHead { display: grid; }
    }

    @media (max-width: 720px) {
      .main { padding: var(--space-sm); }
      .yard { padding: var(--space-sm); }
      .navStack { grid-template-columns: 1fr; }
      .pageHead h1 { font-size: 34px; }
      .authScreen { grid-template-columns: 1fr; }
      .authIntro { padding: var(--space-lg); }
      .authIntro h1 { font-size: 38px; }
      .authStats, .cards, .formGrid, .specGrid, .settingsGrid { grid-template-columns: 1fr; }
      .stripRow, .timelineItem, .dispatchRow { grid-template-columns: 1fr; }
      table { display: block; overflow-x: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition-duration: 0ms !important;
        animation-duration: 0ms !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const screens = [
      { id: "auth", code: "00", nav: "Đăng nhập", title: "Đăng nhập", subtitle: "Truy cập hệ thống quản lý và cho thuê máy phát điện." },
      { id: "dashboard", code: "01", nav: "Tổng quan", title: "Hôm nay đội máy đang làm gì?", subtitle: "Màn tổng quan gom đội máy, lịch giao nhận, bảo trì và công nợ vào một bảng điều hành duy nhất cho quản lý, kinh doanh và điều phối." },
      { id: "fleet", code: "02", nav: "Đội máy", title: "Đội máy phát điện", subtitle: "Tra cứu máy theo công suất, trạng thái, vị trí, giờ máy và lịch bảo trì." },
      { id: "generator", code: "03", nav: "Hồ sơ máy", title: "Hồ sơ máy DG-150-022", subtitle: "Thông tin kỹ thuật, lịch sử thuê, bảo trì, tài liệu và cảnh báo vận hành của từng máy." },
      { id: "customers", code: "04", nav: "Khách hàng", title: "Khách hàng và công trình", subtitle: "Quản lý hồ sơ khách hàng, người liên hệ, công trình, hạn mức công nợ và lịch sử giao dịch." },
      { id: "sales", code: "05", nav: "Báo giá", title: "Báo giá và hợp đồng", subtitle: "Lập báo giá, chọn máy khả dụng, duyệt nội bộ, xuất PDF và chuyển thành hợp đồng." },

              ["DG-250-011", "250 kVA", "286M", "82%"],
              ["DG-150-022", "150 kVA", "318M", "76%"]
            ]))}
          </div>
          <div class="stack">
            ${panel("Chỉ số quản trị", specGrid([["Tỷ lệ khai thác", "59%"], ["Doanh thu/máy", "22.1M"], ["Chi phí bảo trì", "184M"], ["DSO", "—"]]))}
            ${panel("Báo cáo lưu sẵn", timeline([
              ["01", "Công nợ tuần", "Gửi kế toán sáng thứ hai", badge("Auto")],
              ["02", "Khai thác đội máy", "Gửi quản lý cuối tháng", badge("Auto")],
              ["03", "Bảo trì quá hạn", "Cảnh báo mỗi ngày", badge("Daily")]
            ]))}
          </div>
        </section>
      `;
    }

    function settingsBody() {
      return `
        <section class="grid">
          <div class="stack">
            ${panel("Nhóm cấu hình", `<div class="settingsGrid">${["Người dùng & vai trò", "Chi nhánh/kho", "Danh mục công suất", "Bảng giá thuê", "Phụ phí", "Mẫu hợp đồng", "Checklist", "Thông báo"].map(x => `<div class="settingBox"><b>${x}</b><span>Đang dùng</span></div>`).join("")}</div>`)}
            ${panel("Bảng giá thuê", table(["Công suất", "Ngày", "Tuần", "Tháng"], [
              ["60 kVA", "1.2M", "7M", "21M"],
              ["150 kVA", "2.4M", "14M", "42M"],
              ["250 kVA", "3.8M", "23M", "68M"],
              ["500 kVA", "6.5M", "41M", "118M"]
            ]))}
          </div>
          <div class="stack">
            ${panel("Quy tắc duyệt", timeline([
              ["A", "Giảm giá > 10%", "Cần quản lý duyệt", badge("Active", "run")],
              ["B", "Có công nợ quá hạn", "Kế toán xác nhận", badge("Active", "run")],
              ["C", "Bảng giá", "Có ngày hiệu lực và version", badge("Active", "run")]
            ]))}
          </div>
        </section>
      `;
    }

    function mobileBody() {
      return `
        <div class="mobilePreview">
          <div class="mobileTop"><div class="mark"><span>DG</span><div><strong>KTV Sơn</strong><small>Việc hôm nay</small></div></div>${badge("08:30")}</div>
          <div class="mobileBody">
            ${panel("Giao máy DG-150-022", specGrid([["Địa điểm", "KCN Tân Thuận"], ["Khách", "Anh Dũng"], ["Liên hệ", "0908 221 118"]]))}
            ${panel("Checklist bàn giao", checks(["Kiểm tra ngoại quan", "Ghi chỉ số giờ máy", "Kiểm tra nhiên liệu", "Chạy thử có tải", "Khách ký biên bản", "Chụp ảnh hoàn tất"]))}
            ${panel("Ảnh hiện trường", specGrid([["Trước giao", "Đã chụp"], ["Tem máy", "Đã chụp"], ["Tải thử", "Chưa chụp"]]))}
            <button class="primary">Hoàn tất bàn giao</button>
          </div>
        </div>
      `;
    }

    const renderers = {
      dashboard: () => shell(screens.find(s => s.id === "dashboard"), overviewBody(), ["Xuất ca", "Tạo báo giá"]),
      fleet: () => shell(screens.find(s => s.id === "fleet"), fleetBody(), ["Import", "Thêm máy"]),
      generator: () => shell(screens.find(s => s.id === "generator"), generatorBody(), ["Tạo bảo trì", "Tạo báo giá"]),
      customers: () => shell(screens.find(s => s.id === "customers"), customersBody(), ["Thêm công trình", "Tạo báo giá"]),
      sales: () => shell(screens.find(s => s.id === "sales"), salesBody(), ["Lưu nháp", "Gửi duyệt"]),
      rental: () => shell(screens.find(s => s.id === "rental"), rentalBody(), ["Tạo lệnh giao", "Gia hạn"]),
      dispatch: () => shell(screens.find(s => s.id === "dispatch"), dispatchBody(), ["Dạng bản đồ", "Tạo lệnh"]),
      maintenance: () => shell(screens.find(s => s.id === "maintenance"), maintenanceBody(), ["Xuất lịch", "Tạo việc"]),
      billing: () => shell(screens.find(s => s.id === "billing"), billingBody(), ["Ghi nhận tiền", "Tạo hóa đơn"]),
      reports: () => shell(screens.find(s => s.id === "reports"), reportsBody(), ["Lưu bộ lọc", "Xuất Excel"]),
      settings: () => shell(screens.find(s => s.id === "settings"), settingsBody(), ["Tạo bảng giá", "Lưu thay đổi"]),
      mobile: () => shell(screens.find(s => s.id === "mobile"), mobileBody(), ["Xem offline", "Đồng bộ"]),
      auth: renderAuth
    };

    function render() {
      app.innerHTML = `
        <div class="appShell">
          <aside class="yard">
            <div class="mark"><span>DG</span><div><strong>Dynamo Rental</strong><small>Depot control</small></div></div>
            <div class="yardDate"><small>Ca vận hành</small><strong>23/07</strong><span>Asia/Bangkok</span></div>
            <div class="navStack">
              <div class="railLabel">Màn hình</div>
              ${screens.map(screen => `<button class="navButton ${activeScreen === screen.id ? "active" : ""}" data-go="${screen.id}"><span>${screen.nav}</span><span class="navCode">${screen.code}</span></button>`).join("")}
            </div>
            <div class="powerStack">
              <div class="railLabel">Dải công suất</div>
              <div class="powerSlot"><div><b>30-60</b><span>kVA · dân dụng nhẹ</span></div><span>24</span></div>
              <div class="powerSlot"><div><b>100-150</b><span>kVA · nhà xưởng</span></div><span>46</span></div>
              <div class="powerSlot"><div><b>250</b><span>kVA · công nghiệp</span></div><span>31</span></div>
              <div class="powerSlot"><div><b>500</b><span>kVA · tải lớn</span></div><span>9</span></div>
            </div>
            <div class="yardNote"><b>Nguyên tắc màn hình</b>Nhìn như bảng điều hành bãi máy: ít trang trí, nhiều tín hiệu, ưu tiên lệnh cần xử lý trong hôm nay.</div>
          </aside>
          <main class="main">
            <div class="command">
              <div class="search">Tìm máy, hợp đồng, khách hàng, công trình...</div>
              <button>Xuất ca</button>
              <button class="primary">Tạo báo giá</button>
              <div class="avatar">AN</div>
            </div>
            <div>
              ${screens.map(screen => renderers[screen.id]()).join("")}
            </div>
          </main>
        </div>
      `;
      app.querySelectorAll("[data-go]").forEach(el => {
        el.addEventListener("click", () => {
          activeScreen = el.dataset.go;
          render();
        });
      });
    }

    render();
  </script>
</body>
</html>
